# =============================================================================
# Render Blueprint — AfriSend
#
#   Dashboard → New → Blueprint → point at this repository.
#   Render creates the API service and asks you for every secret marked
#   `sync: false` (nothing secret is committed here).
#
# The Postgres database lives on Supabase, not on Render, so that Point-in-Time
# Recovery and the Supabase SQL editor stay available to the compliance team.
# =============================================================================
services:
  - type: web
    name: afrisend-api
    runtime: docker
    plan: starter                 # free tier works for staging; use starter+ for production
    region: frankfurt             # closest to Qatar/Doha of Render's regions
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/public/healthz
    autoDeploy: true
    disk:                         # only needed if you keep local uploads
      name: afrisend-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: APP_VERSION
        value: "1.0.0"

      # ---- Supabase Postgres (connection string from Project Settings) ----
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: DB_POOL_MAX
        value: 10

      # ---- Auth / crypto (generate with: openssl rand -hex 32) ------------
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ISSUER
        value: afrisend.qa
      - key: PII_ENCRYPTION_KEY
        generateValue: true     # 32 bytes hex, generated by Render
      - key: PII_HMAC_KEY
        generateValue: true

      # ---- Flutterwave v3 --------------------------------------------------
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: FLW_BASE_URL
        value: https://api.flutterwave.com/v3

      # ---- Ria (optional cash-pickup rail) --------------------------------
      - key: RIA_API_KEY
        sync: false
      - key: RIA_API_SECRET
        sync: false
      - key: RIA_AGENT_ID
        sync: false
      - key: RIA_BASE_URL
        value: https://api.riamoneytransfer.com/v1
      - key: RIA_WEBHOOK_SECRET
        sync: false

      # ---- SMS (OTP delivery) ---------------------------------------------
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # ---- Origins / console ----------------------------------------------
      - key: PUBLIC_BASE_URL
        value: https://afrisend-api.onrender.com
      - key: CORS_ORIGINS
        value: https://afrisend-api.onrender.com
      - key: ADMIN_CONSOLE_ENABLED
        value: "true"

      # =======================================================================
      # FIRST-RUN SETUP — fill these in the Render dashboard. Each bootstrap
      # step runs only while its table is empty, so they are safe to leave set.
      # =======================================================================

      # ---- First operator account (sign in at /admin afterwards) ----------
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

      # ---- Corridors and rates — YOUR Treasury numbers --------------------
      #   NGN=421.06, GHS=4.28, KES=35.55, XOF=165.20
      #   (or NGN=421.06/415.00 to set base and retail explicitly)
      - key: BOOTSTRAP_CORRIDORS
        sync: false
      - key: BOOTSTRAP_CORRIDOR_SPREAD
        value: "1.5"
      - key: BOOTSTRAP_CORRIDOR_LIMIT_QAR
        value: "20000"

      # ---- Sanctions list (screening). Without one, transfers hold. -------
      #   OFAC_SDN|https://www.treasury.gov/ofac/downloads/sdn.csv
      - key: BOOTSTRAP_SANCTIONS_URLS
        sync: false

      # ---- Regulatory identity printed on QCB filings ----------------------
      - key: INSTITUTION_NAME
        value: AfriSend Remittance LLC
      - key: QCB_LICENSE_NUMBER
        sync: false
      - key: MLRO_NAME
        sync: false

# -----------------------------------------------------------------------------
# Optional: serve the operations console as its own static site (behind Render's
# access control) instead of from the API. If you enable it, set
# ADMIN_CONSOLE_ENABLED=false on the API and point the console's API_BASE at the
# API host — cross-origin is then handled by CORS_ORIGINS.
# -----------------------------------------------------------------------------
